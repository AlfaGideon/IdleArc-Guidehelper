name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'hub/companion/**'
      - '.github/workflows/android-apk.yml'
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted Ubuntu images include an Android SDK; avoid commandline-tools downloads.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: |
          gradle --no-daemon -p android :app:assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - if: failure()
        run: |
          echo '### Build failure' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          tail -90 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: IdleArc-Guide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
