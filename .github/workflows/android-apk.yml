name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'hub/companion/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
  checks: write
jobs:
  debug-apk:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish signed apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted Ubuntu images include an Android SDK; avoid commandline-tools downloads.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: |
          gradle --no-daemon -p android :app:assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - if: failure()
        run: |
          echo '### Build failure' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -90 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/check-runs -X POST \
            -f name='Android build diagnostics' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=failure \
            -f output[title]='Build failure' -f output[summary]="$(tail -90 build.log)"
      - uses: actions/upload-artifact@v4
        with:
          name: IdleArc-Guide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  signed-release:
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish signed apk]'))) && github.ref == 'refs/heads/arena/338bb9c1-idlearc-guidehelper'
    permissions:
      contents: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Derive stable signing key from one secret
        env:
          ANDROID_SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        run: |
          python3 scripts/derive-android-keystore.py "$RUNNER_TEMP/idlearc-release.p12"
          # Derived values are placed in GITHUB_ENV by the script (never printed).
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/idlearc-release.p12
        run: |
          gradle --no-daemon -p android :app:assembleRelease --console=plain --stacktrace 2>&1 | tee release-build.log
          exit ${PIPESTATUS[0]}
      - name: Report safe release failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Do not expose the full build log (it may contain secret values).
          grep -E '^FAILURE:|^\* What went wrong:|^Execution failed|^> |^Caused by:|^\s+at com.android.*Key|^\s+at java.security.*Key' release-build.log | grep -v '^> Task' | tail -30 > safe-failure.log || true
          gh api repos/$GITHUB_REPOSITORY/check-runs -X POST \
            -f name='Android release diagnostics' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=failure \
            -f output[title]='Signed release failure' -f output[summary]="$(cat safe-failure.log)"
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; bump versionCode and versionName."; exit 1; fi
          cp android/app/build/outputs/apk/release/app-release.apk IdleArc-Guide.apk
          gh release create "$TAG" IdleArc-Guide.apk --target "$GITHUB_SHA" --title "IdleArc Guide $TAG" --notes "Подписанная Android-сборка. Установите вручную; последующие версии проверяются кнопкой ↻ APK."
