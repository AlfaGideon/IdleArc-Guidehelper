name: Publish signed Android release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-release:
    if: github.ref == 'refs/heads/arena/338bb9c1-idlearc-guidehelper' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Derive stable signing key from one secret
        env:
          ANDROID_SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        run: |
          python3 scripts/derive-android-keystore.py "$RUNNER_TEMP/idlearc-release.p12"
          # Derived values are placed in GITHUB_ENV by the script (never printed).
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/idlearc-release.p12
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; bump versionCode and versionName."; exit 1; fi
          cp android/app/build/outputs/apk/release/app-release.apk IdleArc-Guide.apk
          gh release create "$TAG" IdleArc-Guide.apk --target "$GITHUB_SHA" --title "IdleArc Guide $TAG" --notes "Подписанная Android-сборка. Установите вручную; последующие версии проверяются кнопкой ↻ APK."
