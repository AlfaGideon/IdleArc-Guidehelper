<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>IdleArc Guide Helper — планировщик сборок</title>
<meta name="build" content="2026-10-05.1" />
<meta name="description" content="Помощник по сборке персонажа в IdleArc (Season 2, патч 1.3.1): классовые навыки, статы, аффиксы, гемы, петы, талисманы." />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">IA</div>
    <div>
      <h1>IdleArc Guide Helper</h1>
      <p class="sub">Планировщик сборок под класс, цель и уровень · <span id="meta-version">Season 2</span> · сборка <b id="meta-build">…</b></p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="planner" class="active">Планировщик</button>
    <button data-tab="passives">Пассивное дерево</button>
    <button data-tab="calc">Калькуляторы</button>
    <button data-tab="codex">Кодекс</button>
    <button data-tab="nuances">Нюансы и источники</button>
    <button id="reload-btn" class="btn ghost" title="Загрузить файлы приложения заново (обход кэша браузера)">Обновить</button>
  </nav>
</header>

<div id="boot-error" class="boot-error" hidden></div>

<main id="view"></main>

<footer class="foot">
  <p>Неофициальный фанатский инструмент. Данные: <a href="https://idlearc.com/patch-notes/1-3-1" target="_blank" rel="noopener">официальные патч-ноты 1.3.1</a>,
  <a href="https://idlearc.com/classes" target="_blank" rel="noopener">официальные классы</a> и
  <a href="https://idlearc.fandom.com/wiki/IdleArc_Wiki" target="_blank" rel="noopener">IdleArc Wiki</a>.
  Снапшот: <span id="foot-date"></span>. Сборка приложения: <span id="foot-build"></span>.</p>
</footer>

<script>
/* Страховка: если модули не загрузились (кэш, прокси, старый браузер), страница не останется пустой. */
(function () {
  function build() {
    var m = document.querySelector('meta[name="build"]');
    return m ? m.content : 'неизвестно';
  }
  function show(html) {
    var box = document.getElementById('boot-error');
    if (!box) return;
    box.hidden = false;
    box.innerHTML = '<b>Приложение не загрузилось</b><div>' + html + '</div>'
      + '<div class="boot-actions">HTML-сборка страницы: <code>' + build() + '</code> · ожидается сборка приложения '
      + '<code>2026-10-05.1</code>'
      + ' <button class="btn primary" onclick="location.reload(true)">Перезагрузить</button></div>'
      + '<div class="muted small">Если кнопка не помогает — нажмите Ctrl+Shift+R (жёсткая перезагрузка): браузер мог сохранить старые файлы.</div>';
  }
  window.__boot = { ready: false, show: show };

  window.addEventListener('error', function (e) {
    if (window.__boot.ready) return;
    var where = e.filename || (e.target && (e.target.src || e.target.href)) || '';
    show('Ошибка: <code>' + (e.message || 'скрипт не выполнился') + '</code>' + (where ? '<br>Файл: <code>' + where + '</code>' : ''));
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    if (window.__boot.ready) return;
    var r = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    show('Ошибка JS: <code>' + r + '</code>');
  });

  /* Перезагрузка в обход кэша: добавляем к адресу метку времени. */
  function hardReload() {
    var url = location.pathname + '?b=' + Date.now() + (location.hash || '');
    location.replace(url);
  }
  window.__boot.hardReload = hardReload;

  setTimeout(function () {
    if (window.__boot.ready) return;
    var entry = (document.querySelector('script[type="module"]') || {}).src || 'src/app.js';
    var graph = window.__boot.graph ? '<br>Файлы модулей загрузились, но приложение не отрисовалось — значит ошибка при выполнении.' : '';
    var head = 'Модуль приложения не запустился за 8 секунд.' + graph
      + '<br>Файл точки входа: <code>' + entry + '</code>';
    var tail = '<div class="boot-actions"><button class="btn primary" onclick="window.__boot.hardReload()">Перезагрузить без кэша</button></div>';
    if (!window.fetch) { show(head + tail); return; }
    /* Проверяем, отдаётся ли файл модуля вообще: это отличает проблему сервера от ошибки в коде. */
    fetch(entry, { cache: 'reload' }).then(function (r) { return r.status; })
      .then(function (code) {
        var verdict = code === 200
          ? '<br>Файл модуля сервер отдаёт (200) — значит дело в выполнении кода или в загрузке зависимостей.'
          : '<br>Сервер отдал файл модуля с кодом <code>' + code + '</code> — страница открыта по старому адресу.';
        show(head + verdict + tail);
      })
      .catch(function () {
        show(head + '<br>Файл модуля не удалось даже скачать — похоже, пропала связь с сервером.' + tail);
      });
  }, 8000);

  try {
    fetch('api/build', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (info) {
      if (!info || !info.build || window.__boot.ready) return;
      if (info.build !== build()) {
        show('Страница загружена из кэша: HTML-сборка <code>' + build() + '</code>, на сервере <code>' + info.build + '</code>.');
      }
    }).catch(function () {});
  } catch (err) { /* fetch недоступен — не критично */ }
})();
</script>
<script type="module" src="src/app.js" onerror="window.__boot && window.__boot.show('Файл точки входа <code>src/app.js</code> не загрузился: сервер не отдал модуль. Проверьте, что приложение запущено, и нажмите «Перезагрузить без кэша».')"></script>
</body>
</html>
