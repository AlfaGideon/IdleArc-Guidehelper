plugins { id 'com.android.application' }

android {
    namespace 'com.idlearc.guidehelper'
    compileSdk 35
    defaultConfig {
        applicationId 'com.idlearc.guidehelper'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.10.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}

// Stable signing is ONLY configured on the release runner with repository secrets.
def releaseKey = System.getenv('ANDROID_KEYSTORE_PATH')
if (releaseKey) {
    android.signingConfigs {
        release {
            storeFile file(releaseKey)
            storeType "pkcs12"
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
}

// Companion remains a single source of truth in hub/companion.
def syncCompanion = tasks.register('syncCompanion', Copy) {
    from("${rootProject.projectDir}/../hub/companion") {
        include 'index.html', 'app.js', 'passive-rules.js', 'styles.css', 'data/**', 'icons/**'
    }
    into layout.buildDirectory.dir('generated/companionAssets/companion')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/companionAssets'))
tasks.named('preBuild').configure { dependsOn(syncCompanion) }
